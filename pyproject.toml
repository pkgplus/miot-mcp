[build-system]
requires = ["setuptools>=61", "wheel", "toml>=0.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "miot-x"
version = "0.2.1"
description = "AI-powered Xiaomi Mijia smart home control — bundled miot_kit SDK, zero external SDK dependency"
requires-python = ">=3.10"
dependencies = [
    "aiocache>=0.12.3",
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.1",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "fastmcp>=3.4.2",
    "zeroconf>=0.149.16",
    "av>=17.1.0",
    "pillow>=12.2.0",
    "toml>=0.10.2",
    "qrcode>=8.0",
    "websockets>=11.0",
    "python-socks[asyncio]>=2.0",
    "python-dotenv>=1.0",
    "HAP-python>=4.0",
    "paho-mqtt>=2.1.0",
    "bleak>=1.0.1",
    "cryptography>=43.0",
]

[project.scripts]
miot-x = "miot_x:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["miot_x*", "miot*"]

[tool.setuptools.package-data]
miot = ["libs/**/*.*", "specs/*", "i18n/**/*.*", "configs/*"]
